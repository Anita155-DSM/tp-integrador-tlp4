services:
  db:
    image: mongo:7
    container_name: tp_mongo # nombre fijo del contenedor
    restart: unless-stopped # si se cae o reiniciás la compu, vuelve a arrancar solo
    environment: # variables que recibe MongoDB DENTRO del contenedor
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports: # puerto de la compu : puerto dentro del contenedor
      - "${DB_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tp_backend
    restart: unless-stopped
    environment:
      # dentro de la red de Docker, el backend ve a Mongo por el nombre del servicio ("db")
      # y por el puerto interno (27017), no por localhost ni por DB_PORT.
      DB_HOST: db
      DB_PORT: 27017
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy # espera a que Mongo responda antes de arrancar

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_API_URL se "hornea" al compilar, por eso va como build arg.
        # la abre el navegador, así que apunta a localhost, no al nombre del servicio.
        VITE_API_URL: ${VITE_API_URL}
    container_name: tp_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
